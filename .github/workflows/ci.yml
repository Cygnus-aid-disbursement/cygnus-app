name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # The SDK is a private GitHub Packages dependency; the default token can
          # read packages in this organisation.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          "npm_config_//npm.pkg.github.com/:_authToken": ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
